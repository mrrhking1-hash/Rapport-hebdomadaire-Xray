<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Care Space - Gestion Rapport</title>
    
    <link rel="apple-touch-icon" href="Rapport hebdomadaire Xray -logo.png">
    <link rel="icon" type="image/png" href="Rapport hebdomadaire Xray -logo.png">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --bg-dark: #1a1a1a; --card-dark: #262626; --accent-blue: #3b82f6; --text-gray: #e0e0e0; }
        body { background-color: var(--bg-dark); color: var(--text-gray); font-family: sans-serif; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        /* En-tête avec Logo */
        .header-flex { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 20px; 
        }
        .logo-app {
            width: 70px;
            height: auto;
            object-fit: contain;
            border-radius: 8px;
        }

        .input-section { background: var(--card-dark); padding: 25px; border-radius: 12px; border: 1px solid #333; margin-bottom: 30px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .input-group { display: flex; flex-direction: column; }
        label { font-size: 12px; color: #aaa; margin-bottom: 5px; text-transform: uppercase; }
        input { padding: 12px; background: #333; border: 1px solid #444; border-radius: 6px; color: white; outline: none; }
        .button-group { grid-column: span 2; display: flex; gap: 10px; margin-top: 10px; }
        button { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-send { background: #059669; color: white; flex: 1; }
        .btn-save { background: var(--accent-blue); color: white; flex: 2; }
        .btn-clear { background: #dc2626; color: white; flex: 1; }
        
        /* Tableau */
        .table-container { background: white; border-radius: 8px 8px 0 0; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        table { width: 100%; border-collapse: collapse; color: black; }
        thead tr { background: black; color: white; }
        th, td { padding: 8px 12px; text-align: left; border: 0.5px solid black; font-size: 14px; }
        
        .col-date { font-weight: bold; font-style: italic; }
        .col-qty { font-weight: bold; color: black; }
        .col-italic { font-style: italic; }
        .btn-action { background: none; border: 1px solid #ccc; padding: 4px 8px; color: #333; font-size: 11px; margin-right: 5px; cursor: pointer;}
        
        .no-pdf { display: table-cell; }
        .no-print { display: block; }

        /* --- ADAPTATION MOBILE --- */
        @media (max-width: 600px) {
            body { padding: 10px; }
            .header-flex { flex-direction: column-reverse; text-align: center; gap: 15px; }
            .input-section { grid-template-columns: 1fr; padding: 15px; }
            .button-group { grid-column: span 1; flex-direction: column; }
            .logo-app { width: 80px; }
            .table-container { overflow-x: auto; }
            th, td { padding: 8px 5px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="no-print">
        <div class="header-flex">
            <div>
                <h2 style="margin: 0;">Rapport Hebdomadaire</h2>
                <p style="color: #666; margin: 5px 0; font-style: italic;" id="dateDisplay"></p>
            </div>
            <img src="Rapport hebdomadaire Xray -logo.png" alt="Logo" class="logo-app">
        </div>

        <div class="input-section">
            <div class="input-group">
                <label>Commande</label>
                <input type="text" id="commande" list="list-commande">
                <datalist id="list-commande"></datalist>
            </div>
            <div class="input-group">
                <label>Fournisseur</label>
                <input type="text" id="fournisseur" list="list-fournisseur">
                <datalist id="list-fournisseur"></datalist>
            </div>
            <div class="input-group">
                <label>Quantité</label>
                <input type="number" id="quantite">
            </div>
            <div class="input-group">
                <label>Chantier</label>
                <input type="text" id="chantier" list="list-chantier">
                <datalist id="list-chantier"></datalist>
            </div>
            <div class="button-group">
                <button class="btn-save" onclick="enregistrer()">ENREGISTRER</button>
                <button class="btn-send" onclick="exporterPDF()">ENVOYER (PDF)</button>
                <button class="btn-clear" onclick="viderTout()">VIDER TOUT</button>
            </div>
        </div>
    </div>

    <div id="pdf-content" class="table-container">
        <div style="padding: 15px; text-align: center; border-bottom: 1px solid black;">
            <h3 style="margin: 0; color: black; text-transform: uppercase; letter-spacing: 1px;">Rapport Hebdomadaire</h3>
        </div>
        <table>
            <thead>
                <tr>
                    <th>N°</th><th>Date</th><th>Commande</th><th>Fournisseur</th><th>Qté</th><th>Chantier</th><th class="no-pdf">Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    let donnees = JSON.parse(localStorage.getItem('careSpaceData')) || [];
    let indexEdition = -1;
    document.getElementById('dateDisplay').innerText = "Date : " + new Date().toLocaleDateString('fr-FR');

    window.onload = function() {
        majTableau();
        actualiserSuggestions();
    };

    function sauvegarderLocal() {
        localStorage.setItem('careSpaceData', JSON.stringify(donnees));
    }

    function actualiserSuggestions() {
        const types = ['commande', 'fournisseur', 'chantier'];
        types.forEach(type => {
            const list = document.getElementById(`list-${type}`);
            if(list) {
                const uniqueValues = [...new Set(donnees.map(item => item[type]))].filter(v => v);
                list.innerHTML = uniqueValues.map(v => `<option value="${v}">`).join('');
            }
        });
    }

    function enregistrer() {
        const cmd = document.getElementById('commande').value;
        const four = document.getElementById('fournisseur').value;
        if(!cmd || !four) return alert("Remplissez les champs");

        const ligne = {
            date: new Date().toLocaleDateString('fr-FR'),
            commande: cmd, fournisseur: four,
            quantite: document.getElementById('quantite').value,
            chantier: document.getElementById('chantier').value
        };

        if(indexEdition === -1) { donnees.push(ligne); } 
        else { donnees[indexEdition] = ligne; indexEdition = -1; }

        sauvegarderLocal();
        viderChamps();
        majTableau();
        actualiserSuggestions();
    }

    function majTableau() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';
        donnees.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${index + 1}</td><td class="col-date">${item.date}</td>
                <td class="col-italic">${item.commande}</td><td class="col-italic">${item.fournisseur}</td>
                <td class="col-qty">${item.quantite}</td><td class="col-italic">${item.chantier}</td>
                <td class="no-pdf"><button class="btn-action" onclick="editer(${index})">EDIT</button><button class="btn-action" style="color:red" onclick="supprimer(${index})">X</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function exporterPDF() {
        const element = document.getElementById('pdf-content');
        
        // Correction pour le format mobile : on force temporairement une largeur fixe
        const originalWidth = element.style.width;
        element.style.width = "1000px"; 

        const dateOptions = { day: 'numeric', month: 'long', year: 'numeric' };
        const dateString = new Date().toLocaleDateString('fr-FR', dateOptions);
        const fileName = `Rapport Xray - ${dateString}.pdf`;

        const options = {
            margin: 10,
            filename: fileName,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { 
                scale: 2, 
                useCORS: true, 
                windowWidth: 1050, // Force le rendu comme sur un ordi pour que le tableau soit complet
                ignoreElements: (el) => el.classList.contains('no-pdf') 
            },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };

        html2pdf().set(options).from(element).save().then(() => {
            element.style.width = originalWidth; // On remet le style mobile après l'impression
        });
    }

    function editer(index) {
        const item = donnees[index];
        document.getElementById('commande').value = item.commande;
        document.getElementById('fournisseur').value = item.fournisseur;
        document.getElementById('quantite').value = item.quantite;
        document.getElementById('chantier').value = item.chantier;
        indexEdition = index;
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function supprimer(index) { 
        if(confirm("Supprimer cette ligne ?")) { 
            donnees.splice(index, 1); 
            sauvegarderLocal();
            majTableau(); 
            actualiserSuggestions();
        } 
    }

    function viderTout() {
        if(confirm("Voulez-vous vraiment effacer TOUTES les données du tableau ?")) {
            donnees = [];
            sauvegarderLocal();
            majTableau();
            actualiserSuggestions();
            viderChamps();
        }
    }
    
    function viderChamps() { document.querySelectorAll('input').forEach(i => i.value = ''); }
</script>
</body>
</html>
